[project]
name = "quiz-game"
version = "0.1.0"
description = "Console True/False quiz from Udemy's 100 Days of Code, day 17 (the quiz project)."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
# The program uses only the standard library: no runtime dependencies.
dependencies = []

# Development-only tools. Install them in the local .venv with
# `python -m pip install --group dev` (needs pip 25.1 or newer, PEP 735).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The course's files are top-level modules in src/ (from question_model import Question).
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
# The modules in src/ and the helpers in tests/ (fakes, conftest) are first-party code.
src = ["src", "tests"]
# src/data.py is the course's data file: its data lines keep the course's layout, so
# ruff neither lints nor reformats it.
extend-exclude = ["src/data.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # pep8-naming
    "UP",  # modern syntax
    "B",   # bugbear
    "ANN", # every function and method signature is annotated
    "PT",  # pytest style
]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
